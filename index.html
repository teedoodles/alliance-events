<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alliance University Events</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#1a2233;--mut:#5b6577;--ln:#dde1ea;--pri:#1d3a6b;--acc:#8e1b2c;--ok:#1f7a4d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#10141d;--card:#181e2b;--tx:#e8ebf2;--mut:#9aa5ba;--ln:#2a3345;--pri:#4a74c4;--acc:#d4677a;--ok:#4cc38a;--bad:#f08a84}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 'Source Sans 3',system-ui,sans-serif}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;margin:0 0 .5rem;line-height:1.2}h1{font-size:1.7rem}h2{font-size:1.3rem}h3{font-size:1.05rem}
header{background:var(--card);border-bottom:3px solid var(--acc);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
header img{height:44px;background:#fff;padding:2px 6px;border-radius:4px;max-width:60%}header nav{margin-left:auto;display:flex;gap:6px}
main{max-width:980px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:16px;margin-bottom:14px}
button{font:inherit;font-weight:600;border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:6px;padding:8px 14px;cursor:pointer;min-height:40px}
button.s{background:transparent;color:var(--pri)}button.d{background:transparent;border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 3px}
input,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);min-height:40px}
input[type=checkbox]{width:auto;min-height:0;margin-right:8px}input.bad{border-color:var(--bad)}
.g{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.row{display:flex;gap:8px;align-items:flex-end}.row>input{flex:1}
.mut{color:var(--mut);font-size:.9rem}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.err{color:var(--bad);font-size:.85rem;min-height:1px}
.banner{border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:8px 12px;margin:10px 0}.banner:empty{display:none}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.tabs button:not(.on){background:transparent;color:var(--pri)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.stats div{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--pri);border-radius:6px;padding:10px 12px}.stats b{display:block;font-size:1.6rem;font-family:'Source Serif 4',serif}
.bar{height:10px;background:var(--pri);border-radius:5px;min-width:4px}.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--ln);white-space:nowrap}
.ph{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--ln)}
.steps{display:flex;gap:6px;margin-bottom:12px}.steps span{flex:1;height:5px;border-radius:3px;background:var(--ln)}.steps .on{background:var(--acc)}
dialog{border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);max-width:340px;text-align:center}
video,#rd,#ckr{width:100%;max-width:320px;border-radius:6px}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:6px;display:none;z-index:9;max-width:90%}
html{-webkit-text-size-adjust:100%}button{touch-action:manipulation}
input[type=date],input[type=time],input[type=datetime-local]{min-width:0;max-width:100%;min-height:42px}dialog{width:calc(100% - 32px)}
.note{background:var(--card);border-bottom:1px dashed var(--acc);padding:8px 16px;font-size:.85rem;color:var(--mut)}
@media(max-width:640px){main{padding:12px}.card{padding:12px}h1{font-size:1.4rem}header{padding:8px 12px;gap:8px}header img{height:34px;max-width:52%}header nav button{padding:6px 10px;min-height:36px}
.g{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.row{flex-wrap:wrap}.row>input{min-width:0;flex:1 1 150px}.row>button{flex:1 1 auto}
.sc{overflow:visible;padding:0;border:0;background:none}table,thead,tbody,tr,td{display:block}thead{display:none}
tr{background:var(--card);border:1px solid var(--ln);border-radius:8px;margin-bottom:10px;padding:8px 12px}
td{display:flex;justify-content:space-between;align-items:center;gap:10px;white-space:normal;border:0;padding:4px 0;word-break:break-word;text-align:right}
td::before{content:attr(data-label);color:var(--mut);font-size:.8rem;flex:none;text-align:left}td[colspan]::before{content:none}}
</style>
</head>

<script>
/* ====== CONFIG: set this to your deployed backend URL (no trailing slash) ====== */
const API='https://script.google.com/macros/s/AKfycbyYPoC_K_pyzdZLfV41CIoKWxayeQ3dnF_wdjQEBqTrWmKbOG88_2hVoy1MRQFM-0SO/exec';   // '' = demo mode (data stays in this browser). For live use, paste your Google Apps Script Web App URL here (it ends in /exec)
const DEMO=!API;

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=(m,ms=3200)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',ms)};
const fmt=d=>d?new Date(d).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'';
const tok=()=>{try{return sessionStorage.getItem('au-tok')||''}catch(e){return''}},setTok=t=>{try{t?sessionStorage.setItem('au-tok',t):sessionStorage.removeItem('au-tok')}catch(e){}};
const b64=b=>new Promise(r=>{const x=new FileReader;x.onload=()=>r(x.result);x.readAsDataURL(b)});
/* Every call is a GET: Google's redirect rejects cross-site POST requests, but GET works. */
async function send(body){let r,d;try{r=await fetch(API+'?d='+encodeURIComponent(JSON.stringify(body)))}catch(e){throw{message:'Cannot reach the server. Check your connection and the API address at the top of this file.'}}
 try{d=await r.json()}catch(e){throw{message:'Unexpected reply from the server. Check that the API address is the Web App URL ending in /exec.'}}
 if(d.token!==undefined)setTok(d.token);if(d.error)throw{status:d.status,message:d.error,fields:d.fields};return d.data}
async function api(path,o={}){if(DEMO)return mock(path,o);
 if(o.blob){const d=await api(path.replace('/export','/export-data')),wb=XLSX.utils.book_new();
  [['Event Summary',d.events],['Participant Details',d.details],['Registration Statistics',d.stats]].forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),n));
  return new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
 const[p,qs]=path.split('?'),body={path:p,method:o.method||'GET',query:Object.fromEntries(new URLSearchParams(qs||'')),token:tok(),data:o.json||null};
 if(o.form){body.data={};for(const[k,v]of o.form.entries())body.data[k]=v instanceof Blob?await b64(v):v}
 if(body.data&&body.data.photo){const parts=body.data.photo.match(/[\s\S]{1,2500}/g),id=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  await Promise.all(parts.map((x,i)=>send({path:'/api/photo-chunk',method:'POST',query:{},token:'',data:{id,i,n:parts.length,part:x}})));
  delete body.data.photo;body.data.photoId=id;body.data.photoN=parts.length}
 return send(body)}
function showErr(e,map={}){document.querySelectorAll('.err').forEach(x=>x.textContent='');document.querySelectorAll('input.bad').forEach(x=>x.classList.remove('bad'));
 let left=[];Object.entries(e.fields||{}).forEach(([k,v])=>{k=map[k]||k;const s=$(`[data-f="${k}"]`);if(s){s.textContent=v;const i=$('#'+k);i&&i.classList.add('bad')}else left.push(v)});
 const b=$('#formerr');if(b)b.textContent=e.fields?(left.length?left.join(' '):'Please fix the highlighted fields.'):e.message;else toast(e.message)}
const fld=(id,label,type='text',extra='')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type}" ${extra}><div class="err" data-f="${id}"></div></div>`;
let scn=null,tm=null,me=null,tab='ov',pg=1;
function stopScan(){if(scn){const s=scn;scn=null;s.stop().then(()=>s.clear()).catch(()=>{})}document.querySelectorAll('#rd,#ckr').forEach(e=>e.hidden=true)}
function startScan(sel,cb){const el=$(sel);el.hidden=false;scn=new Html5Qrcode(el.id);scn.start({facingMode:'environment'},{fps:10,qrbox:220},cb).catch(()=>{toast('Camera unavailable. Allow camera access and try again.');el.hidden=true})}
function route(){stopScan();clearInterval(tm);const h=location.hash.slice(1);
 if(h.startsWith('event-'))return regPage(h.slice(6));if(h.startsWith('done-'))return done(h.slice(5));
 if(h==='admin')return adminGate();home()}
addEventListener('hashchange',route);


/* ====== DEMO BACKEND: mirrors the real API, stores data in this browser ====== */
const DB=(()=>{let s;try{s=JSON.parse(localStorage.getItem('au-demo2'))}catch(e){}
 if(!s){const f=n=>new Date(Date.now()+n*864e5),d=n=>f(n).toISOString().slice(0,10);s={otp:{},regs:[],ev:[
 {id:'11111111-1111-4111-8111-111111111111',name:'Code Sangram 2026',category:'Hackathon',venue:'Main Auditorium, Anekal Campus',event_date:d(20),start_time:'09:00',end_time:'18:00',capacity:200,status:'Upcoming',reg_open:true,archived:false,valid_until:f(20).toISOString()},
 {id:'22222222-2222-4222-8222-222222222222',name:'Research Symposium',category:'Conference',venue:'Seminar Hall B',event_date:d(35),start_time:'10:00',end_time:'16:00',capacity:80,status:'Upcoming',reg_open:true,archived:false,valid_until:f(35).toISOString()}]}}
 return s})();
const keep=()=>{try{localStorage.setItem('au-demo2',JSON.stringify(DB))}catch(e){}};let DADM=false;
const qrData=t=>{const d=document.createElement('div');new QRCode(d,{text:t,width:220,height:220});return d.querySelector('canvas').toDataURL()};
const qrSrc=(k,v)=>qrData(k==='reg'?v:location.href.split('#')[0]+'#event-'+v);
async function mock(path,o){await new Promise(r=>setTimeout(r,120));
 const M=o.method||'GET',[p,qs]=path.split('?'),Q=new URLSearchParams(qs||''),B=o.json||{},bad=(s,m,f)=>{throw{status:s,message:m,fields:f}};
 const act=id=>DB.regs.filter(r=>r.eid===id&&r.status!=='Cancelled'),evOf=id=>DB.ev.find(e=>e.id===id),adm=()=>{if(!DADM)bad(401,'Sign in required.')};
 const st=e=>{const a=act(e.id);return{...e,registered:a.length,verified:a.length,checked_in:a.filter(r=>r.ci).length,cancelled:DB.regs.filter(r=>r.eid===e.id&&r.status==='Cancelled').length,expired:new Date(e.valid_until)<new Date(),seats_left:Math.max(0,e.capacity-a.length)}};
 const flt=()=>{const q=(Q.get('q')||'').toLowerCase(),e=Q.get('eventId'),v=Q.get('verified'),a=Q.get('from'),z=Q.get('to');return DB.regs.filter(r=>(!q||(r.name+r.em+r.mb).toLowerCase().includes(q))&&(!e||r.eid===e)&&v!=='0'&&(!a||r.at.slice(0,10)>=a)&&(!z||r.at.slice(0,10)<=z))};
 let m;
 if(p==='/api/config')return{mobileOtp:true};
 if(p==='/api/events')return DB.ev.filter(e=>!e.archived&&e.status!=='Cancelled').map(st).filter(e=>!e.expired);
 if(m=p.match(/^\/api\/events\/([\w-]+)$/)){const e=evOf(m[1]);if(!e||e.archived)bad(404,'Event not found.');const s=st(e);if(s.expired)bad(410,'This event has ended and registration is no longer available.');return s}
 if(p==='/api/otp/send'){const id=String(B.identifier||'').trim().toLowerCase(),ch=B.channel;
  if(ch==='email'&&!/^\S+@\S+\.\S+$/.test(id))bad(400,'Enter a valid email address.');if(ch==='mobile'&&!/^[6-9]\d{9}$/.test(id))bad(400,'Enter a valid 10-digit mobile number.');
  const x=DB.otp[id];if(x&&Date.now()-x.t<30000)bad(429,'Wait 30 seconds before requesting another OTP.');
  const c=String(Math.floor(100000+Math.random()*900000));DB.otp[id]={c,t:Date.now(),n:0};toast(`Demo mode: your ${ch} OTP is ${c}`,15000);return{sent:true}}
 if(p==='/api/otp/verify'){const id=String(B.identifier||'').trim().toLowerCase(),x=DB.otp[id];if(!x||Date.now()-x.t>6e5)bad(400,'OTP expired. Request a new one.');
  if(x.n>=5)bad(429,'Too many attempts. Request a new OTP.');x.n++;if(String(B.otp)!==x.c)bad(400,'Incorrect OTP.');return{token:`t:${B.channel}:${id}`}}
 if(p==='/api/register'){const f=o.form,g=k=>String(f.get(k)||'').trim(),fe={},name=g('name'),email=g('email').toLowerCase(),mb=g('mobile'),type=g('type');
  if(name.length<2)fe.name='Full name must be at least 2 characters.';else if(!/^[\p{L}][\p{L} .'-]*$/u.test(name))fe.name='Name can only contain letters, spaces, dots, hyphens and apostrophes.';
  if(!/^\S+@\S+\.\S+$/.test(email))fe.email='Enter a valid email address.';if(!/^[6-9]\d{9}$/.test(mb))fe.mobile='Enter a valid 10-digit mobile number.';
  if(!['Student','Faculty','Guest','Alumni'].includes(type))fe.type='Choose a participant type.';
  if(Object.keys(fe).length)bad(400,'Please fix the highlighted fields.',fe);

 $('#pv').onclick=()=>{if(pg>1){pg--;draw()}};$('#nx').onclick=()=>{if(pg<last){pg++;draw()}};draw();
 $('#xl').onclick=async()=>{try{const b=await api('/api/admin/export?'+qs(),{blob:true}),n='registrations-'+new Date().toISOString().slice(0,10)+'.xlsx';
  try{const d=await claude.use('downloads');if(!d)throw 0;await d.save({filename:n,data:b})}catch(x){if(x&&x.code==='declined')return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()}}catch(e){toast(e.fields?Object.values(e.fields)[0]:e.message||'Export failed')}}}
async function checkin(){const draw=async()=>{try{const s=await api('/api/admin/stats');$('#cnt').innerHTML=`<div><b>${s.checkedIn}</b>Checked in (live)</div><div><b>${s.registrations-s.checkedIn}</b>Still expected</div>`}catch(e){}};
 $('#pg').innerHTML=`<div class="card"><h3>Check in a participant</h3><div class="row"><input id="ci" placeholder="Registration ID, e.g. AU1A2B3C" aria-label="Registration ID"><button id="cb">Check in</button></div><p><button class="s" id="cs">Scan with camera</button></p><div id="ckr" hidden></div><div id="res" role="status"></div></div><div class="stats" id="cnt"></div>`;
 const run=async c=>{const R=$('#res');try{const r=await api('/api/admin/checkin',{method:'POST',json:{code:c}});R.innerHTML=`<p class="ok">Checked in: ${esc(r.name)} · ${esc(r.event)}</p>${r.photoUrl?`<img class="ph" style="width:96px;height:96px" src="${esc(r.photoUrl)}" alt="">`:''}`;$('#ci').value='';draw()}catch(x){R.innerHTML=`<p class="bad">${esc(x.fields?Object.values(x.fields)[0]:x.message)}</p>`}};
 $('#cb').onclick=()=>run($('#ci').value);$('#cs').onclick=()=>startScan('#ckr',t=>{stopScan();run(t)});draw();tm=setInterval(draw,5000)}
if(DEMO)$('#demo').hidden=false;route();
</script>
